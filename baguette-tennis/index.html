<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>צמיד טניס בגט</title>
<meta property="og:title" content="צמיד טניס בגט">
<meta property="og:description" content="3 שורות שחמט · סגור על היד ופרוס ישר">
<meta property="og:image" content="../baguette-tennis-closed/preview.jpg">
<style>
  :root { --bg: #f4f3f0; --ink: #232326; --soft: #8a8a90; --pill: #ffffff; --line: #dcdad5; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink);
    font-family: -apple-system, "Segoe UI", Arial, sans-serif; overflow: hidden; }
  .bar { position: fixed; top: 0; left: 0; right: 0; z-index: 5; display: flex; justify-content: center; gap: 8px;
    padding: max(10px, env(safe-area-inset-top)) 16px 10px; pointer-events: none; }
  .tabs { display: flex; gap: 4px; padding: 4px; border-radius: 999px; background: rgba(255,255,255,.82);
    border: 1px solid var(--line); backdrop-filter: blur(8px); pointer-events: auto; }
  .tabs button { border: 0; background: transparent; color: var(--soft); font: inherit; font-size: 15px;
    padding: 9px 16px; border-radius: 999px; cursor: pointer; transition: background .25s, color .25s; }
  .tabs button.on { background: var(--ink); color: #fff; }
  .rail { display: flex; direction: ltr; width: 100%; height: 100%; overflow-x: auto; overflow-y: hidden;
    scroll-snap-type: x mandatory; scroll-behavior: smooth; scrollbar-width: none; }
  .rail::-webkit-scrollbar { display: none; }
  .panel { flex: 0 0 100%; height: 100%; scroll-snap-align: start; position: relative; }
  .panel iframe { width: 100%; height: 100%; border: 0; display: block; }
  .edge { position: fixed; top: 50%; transform: translateY(-50%); z-index: 6; width: 44px; height: 44px;
    border-radius: 50%; border: 1px solid var(--line); background: rgba(255,255,255,.88); color: var(--ink);
    display: grid; place-items: center; cursor: pointer; transition: opacity .3s; }
  .edge svg { width: 20px; height: 20px; }
  .edge.r { right: 10px; } .edge.l { left: 10px; }
  .edge[hidden] { display: grid; opacity: 0; pointer-events: none; }
  .dots { position: fixed; bottom: max(8px, env(safe-area-inset-bottom)); left: 0; right: 0; display: flex;
    justify-content: center; gap: 6px; z-index: 5; pointer-events: none; }
  .dots i { width: 6px; height: 6px; border-radius: 50%; background: var(--line); transition: background .3s, width .3s; }
  .dots i.on { background: var(--ink); width: 18px; border-radius: 3px; }
</style>
</head>
<body>
<div class="bar"><div class="tabs">
  <button data-i="0" class="on">סגור על היד</button>
  <button data-i="1">מקרוב</button>
</div></div>
<div class="rail" id="rail">
  <section class="panel"><iframe src="../baguette-tennis-closed/" title="צמיד סגור על היד" allow="fullscreen"></iframe></section>
  <section class="panel"><iframe src="../baguette-tennis-flat/" title="מקרוב" allow="fullscreen" loading="lazy"></iframe></section>
</div>
<button class="edge r" id="next" aria-label="למסך הבא"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 5l7 7-7 7"/></svg></button>
<button class="edge l" id="prev" aria-label="למסך הקודם" hidden><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 5l-7 7 7 7"/></svg></button>
<div class="dots"><i class="on"></i><i></i></div>
<script>
  const rail = document.getElementById('rail');
  const tabs = [...document.querySelectorAll('.tabs button')];
  const dots = [...document.querySelectorAll('.dots i')];
  const next = document.getElementById('next'), prev = document.getElementById('prev');
  const go = i => rail.scrollTo({ left: i * rail.clientWidth });
  tabs.forEach(b => b.onclick = () => go(+b.dataset.i));
  next.onclick = () => go(1); prev.onclick = () => go(0);
  const mark = () => {
    const i = Math.round(rail.scrollLeft / rail.clientWidth);
    tabs.forEach((b, k) => b.classList.toggle('on', k === i));
    dots.forEach((d, k) => d.classList.toggle('on', k === i));
    next.hidden = i === 1; prev.hidden = i === 0;
  };
  rail.addEventListener('scroll', () => requestAnimationFrame(mark), { passive: true });
  addEventListener('resize', () => go(Math.round(rail.scrollLeft / rail.clientWidth)));
  addEventListener('keydown', e => { if (e.key === 'ArrowRight') go(1); if (e.key === 'ArrowLeft') go(0); });
</script>
</body>
</html>
